name: Review approved Webmention
on:
  issues:
    types: [labeled]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.label.name == 'webmention-approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Verify backlink and approval evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_NUMBER: ${{ github.event.issue.number }}
          REVIEWER_LOGIN: ${{ github.event.sender.login }}
        run: npx tsx scripts/import-webmention.ts --issue "$REFERENCE_NUMBER" --approve --reviewer "$REVIEWER_LOGIN"
      - name: Open reviewable content PR
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_NUMBER: ${{ github.event.issue.number }}
          REFERENCE_RUN: ${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "references/issue-$REFERENCE_NUMBER-$REFERENCE_RUN"
          git add src/data/resources/references.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: verify approved reference $REFERENCE_NUMBER"
          git push origin HEAD
          gh pr create --draft --title "Reference: verified issue $REFERENCE_NUMBER" --body "Pinned public HTTPS fetch, backlink and maintainer label evidence verified. Review source and preview before publishing."
