name: codeql

# Static analysis for security bugs in the TypeScript code (injection, unsafe
# redirects, prototype pollution…). Results appear under Security → Code
# scanning; a new alert on a pull request is shown inline in the diff.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 9 * * 3" # Wednesdays

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
