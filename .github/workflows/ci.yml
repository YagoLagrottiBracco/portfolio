name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, unit tests, the production build and a type-check of everything the
  # build does not compile, such as the tests themselves.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Known high or critical vulnerabilities in what ships fail the run;
      # dev tooling and lower severities are left to Dependabot.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Standalone resource package tests
        run: npm run test:resource-packages

      - name: Validate new blog covers
        run: npm run check:blog-covers

      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

  # Opens the built site in a real browser: language routing, the case study
  # pages, the blog filter, the feeds and the résumé.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Browser tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Lighthouse on the built site (mobile: a mid-range phone on slow 4G, the
  # stricter case; median of three runs).
  # Accessibility, best practices and SEO fail the run below their floor;
  # performance only warns, because shared runners are noisy.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 14
