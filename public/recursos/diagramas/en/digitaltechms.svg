<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img"><rect width="100%" height="100%" fill="#101114"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="55" y="90" font-size="44" fill="#fafafa">Digital Tech MS</text><text x="55" y="145" font-size="24" fill="#d4d4d8">Architecture flow · follow the numbered order</text><rect x="55" y="210" width="640" height="160" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="80" y="253" font-size="26" fill="#93c5fd">1. Configuration</text><text x="80" y="292" font-size="22" fill="#d4d4d8">Material, finish, dimensions and quantity</text><rect x="745" y="210" width="640" height="160" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="770" y="253" font-size="26" fill="#93c5fd">2. Server-side price</text><text x="770" y="292" font-size="22" fill="#d4d4d8">Recalculated before the cart is written · Or</text><text x="770" y="322" font-size="22" fill="#d4d4d8">a custom quote</text><rect x="55" y="405" width="640" height="130" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="80" y="448" font-size="26" fill="#93c5fd">3. Order</text><text x="80" y="487" font-size="22" fill="#d4d4d8">Items and prices frozen</text><rect x="745" y="405" width="640" height="130" rx="18" fill="#191d25" stroke="#93c5fd"/><text x="770" y="448" font-size="26" fill="#93c5fd">4. Artwork approval</text><text x="770" y="487" font-size="22" fill="#d4d4d8">Explicit: only then is production released</text><rect x="55" y="570" width="640" height="130" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="80" y="613" font-size="26" fill="#93c5fd">5. Production</text><rect x="745" y="570" width="640" height="130" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="770" y="613" font-size="26" fill="#93c5fd">6. Delivery</text><text x="770" y="652" font-size="22" fill="#d4d4d8">Shipping or pickup with a code</text><text x="55" y="755" font-size="20" fill="#a1a1aa">lagrotti.dev · Yago Lagrotti Bracco · CC BY 4.0</text></g></svg>