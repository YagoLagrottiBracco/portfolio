<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img"><rect width="100%" height="100%" fill="#101114"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="55" y="90" font-size="44" fill="#fafafa">DevAgent — the Autonomous Kanban</text><text x="55" y="145" font-size="24" fill="#d4d4d8">Architecture flow · follow the numbered order</text><rect x="55" y="210" width="640" height="160" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="80" y="253" font-size="26" fill="#93c5fd">1. Board card</text><text x="80" y="292" font-size="22" fill="#d4d4d8">The requirement as the team already writes it</text><rect x="745" y="210" width="640" height="160" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="770" y="253" font-size="26" fill="#93c5fd">2. Agent</text><text x="770" y="292" font-size="22" fill="#d4d4d8">Interprets the requirement · Writes the</text><text x="770" y="322" font-size="22" fill="#d4d4d8">implementation</text><rect x="55" y="405" width="640" height="130" rx="18" fill="#191d25" stroke="#93c5fd"/><text x="80" y="448" font-size="26" fill="#93c5fd">3. Tests</text><text x="80" y="487" font-size="22" fill="#d4d4d8">No pass, no PR</text><rect x="745" y="405" width="640" height="130" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="770" y="448" font-size="26" fill="#93c5fd">4. Pull request</text><text x="770" y="487" font-size="22" fill="#d4d4d8">Reviewable diff</text><rect x="55" y="570" width="640" height="130" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="80" y="613" font-size="26" fill="#93c5fd">5. Human review</text><text x="80" y="652" font-size="22" fill="#d4d4d8">The final step stays with the team</text><text x="55" y="755" font-size="20" fill="#a1a1aa">lagrotti.dev · Yago Lagrotti Bracco · CC BY 4.0</text></g></svg>