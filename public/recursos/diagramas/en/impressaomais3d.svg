<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img"><rect width="100%" height="100%" fill="#101114"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="55" y="90" font-size="44" fill="#fafafa">ImpressãoMais3D</text><text x="55" y="145" font-size="24" fill="#d4d4d8">Architecture flow · follow the numbered order</text><rect x="55" y="210" width="640" height="160" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="80" y="253" font-size="26" fill="#93c5fd">1. Order</text><text x="80" y="292" font-size="22" fill="#d4d4d8">Catalogue part · STL, OBJ or 3MF upload</text><rect x="745" y="210" width="640" height="160" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="770" y="253" font-size="26" fill="#93c5fd">2. 3D visual proof</text><text x="770" y="292" font-size="22" fill="#d4d4d8">Generated from the uploaded file · React</text><text x="770" y="322" font-size="22" fill="#d4d4d8">Three Fiber</text><rect x="55" y="405" width="640" height="160" rx="18" fill="#191d25" stroke="#93c5fd"/><text x="80" y="448" font-size="26" fill="#93c5fd">3. Customer approval</text><text x="80" y="487" font-size="22" fill="#d4d4d8">An explicit gate in the flow · Auditable</text><text x="80" y="517" font-size="22" fill="#d4d4d8">record</text><rect x="745" y="405" width="640" height="160" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="770" y="448" font-size="26" fill="#93c5fd">4. Production</text><text x="770" y="487" font-size="22" fill="#d4d4d8">Locked until approval · FDM, resin and SLS</text><rect x="55" y="600" width="640" height="130" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="80" y="643" font-size="26" fill="#93c5fd">5. Delivery</text><text x="80" y="682" font-size="22" fill="#d4d4d8">Shipping or in-store pickup</text><text x="55" y="785" font-size="20" fill="#a1a1aa">lagrotti.dev · Yago Lagrotti Bracco · CC BY 4.0</text></g></svg>