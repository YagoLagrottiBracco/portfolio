<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img"><rect width="100%" height="100%" fill="#101114"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="55" y="90" font-size="44" fill="#fafafa">VMageste — High-Volume Marketing Analytics SaaS</text><text x="55" y="145" font-size="24" fill="#d4d4d8">Architecture flow · follow the numbered order</text><rect x="55" y="210" width="640" height="160" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="80" y="253" font-size="26" fill="#93c5fd">1. Traffic sources</text><text x="80" y="292" font-size="22" fill="#d4d4d8">Meta · Google · TikTok</text><rect x="745" y="210" width="640" height="160" rx="18" fill="#191d25" stroke="#93c5fd"/><text x="770" y="253" font-size="26" fill="#93c5fd">2. Ingestion</text><text x="770" y="292" font-size="22" fill="#d4d4d8">Apache Kafka · Decouples ingestion from</text><text x="770" y="322" font-size="22" fill="#d4d4d8">processing</text><rect x="55" y="405" width="640" height="160" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="80" y="448" font-size="26" fill="#93c5fd">3. Processing</text><text x="80" y="487" font-size="22" fill="#d4d4d8">Golang consumers · Lead enrichment and</text><text x="80" y="517" font-size="22" fill="#d4d4d8">deduplication</text><rect x="745" y="405" width="640" height="160" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="770" y="448" font-size="26" fill="#93c5fd">4. Storage</text><text x="770" y="487" font-size="22" fill="#d4d4d8">ClickHouse — analytical queries · PostgreSQL</text><text x="770" y="517" font-size="22" fill="#d4d4d8">— transactional</text><rect x="55" y="600" width="640" height="130" rx="18" fill="#191d25" stroke="#3f3f46"/><text x="80" y="643" font-size="26" fill="#93c5fd">5. Product</text><text x="80" y="682" font-size="22" fill="#d4d4d8">Real-time dashboards · Alerts and reports</text><text x="55" y="785" font-size="20" fill="#a1a1aa">lagrotti.dev · Yago Lagrotti Bracco · CC BY 4.0</text></g></svg>